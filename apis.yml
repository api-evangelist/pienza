name: Pienza
description: >-
  Pienza is a Seattle-based B2B software startup studio and early-stage venture fund founded in 2020
  by Aaron Bird (founder of Bizible, later sold to Marketo). Pienza partners with entrepreneurs to
  ideate, fund, and build category-defining SaaS companies, and later operated a Pienza Ventures
  accelerator focused on helping Indian SaaS and AI startups scale into the U.S. market. It raised
  $5.1M from MHS Capital, Version One Ventures, and Vulcan Capital plus angel investors. Pienza is a
  company-building and investment firm rather than an API provider; enrichment found no public
  developer API, API documentation, or developer portal, and the primary pienza.com domain no longer
  serves an active site.
